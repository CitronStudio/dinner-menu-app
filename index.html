<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今夜なに作る？ - 夕食献立アシスタント</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <header class="app-header">
    <h1>今夜なに作る？</h1>
    <p class="subtitle">旬の食材と今日の特売品から、今日の献立を提案します</p>
  </header>

  <main>
    <section class="card" id="section-season">
      <h2><span class="icon">🌱</span>旬の食材</h2>
      <p class="hint" id="season-month-label"></p>
      <div class="chip-group" id="season-chips">読み込み中…</div>
    </section>

    <section class="card" id="section-sales">
      <h2><span class="icon">🏷️</span>今日の特売品</h2>
      <p class="hint">近所のスーパーのチラシ等を見て、特売になっている食材を入力してください（例：豚肉, きゃべつ, もやし）</p>
      <textarea id="sales-input" rows="2" placeholder="例）豚肉, キャベツ, もやし"></textarea>
    </section>

    <section class="card" id="section-time">
      <h2><span class="icon">⏱️</span>調理時間の目安</h2>
      <div class="chip-group" id="time-chips">
        <button type="button" class="chip selected" data-time="">こだわらない</button>
        <button type="button" class="chip" data-time="15">15分以内</button>
        <button type="button" class="chip" data-time="30">30分以内</button>
      </div>
    </section>

    <div class="cta-row">
      <button class="btn btn-primary" id="btn-suggest">献立を提案する</button>
    </div>

    <section class="card" id="section-result" hidden>
      <h2><span class="icon">🍽️</span>今夜の提案</h2>
      <div id="result-body"></div>
    </section>
  </main>

  <footer class="app-footer">
    <p>家族用の献立提案アプリ / <a href="https://github.com/CitronStudio/dinner-menu-app" target="_blank" rel="noopener">GitHub</a></p>
  </footer>
</div>

<script src="js/app.js"></script>
</body>
</html>
