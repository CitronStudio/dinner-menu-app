<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今夜なに作る？ - 夕食献立アシスタント</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <header class="app-header">
    <h1>今夜なに作る？</h1>
    <p class="subtitle">旬の食材と近所の特売から、今日の献立を提案します</p>
  </header>

  <main>
    <section class="card" id="section-season">
      <h2><span class="icon">🌱</span>旬の食材</h2>
      <p class="hint" id="season-month-label"></p>
      <div class="chip-group" id="season-chips">読み込み中…</div>
    </section>

    <section class="card" id="section-sales">
      <h2><span class="icon">🏷️</span>近所の特売情報</h2>
      <div class="sales-body" id="sales-body">
        <p class="hint">まだ取得していません。</p>
      </div>
      <button class="btn btn-secondary" id="btn-refresh-sales">特売情報を取得</button>
    </section>

    <section class="card" id="section-ng">
      <h2><span class="icon">🚫</span>NG項目</h2>
      <p class="hint">苦手な食材や避けたい調理法を文章で書いておくと、提案に反映されます（例：揚げ物はNG、パクチーが苦手、辛いものは控えめに）</p>
      <textarea id="ng-input" rows="3" placeholder="例）揚げ物はNG。子どもが辛いものを食べられないので控えめに。"></textarea>
    </section>

    <section class="card" id="section-extra">
      <h2><span class="icon">✏️</span>今日の条件（任意）</h2>
      <textarea id="extra-input" rows="2" placeholder="例）作る時間は30分以内。今日は魚の気分。人数は4人分。"></textarea>
    </section>

    <div class="cta-row">
      <button class="btn btn-primary" id="btn-suggest">献立を提案してもらう</button>
    </div>

    <section class="card" id="section-result" hidden>
      <h2><span class="icon">🍽️</span>今夜の提案</h2>
      <div id="result-body"></div>
    </section>
  </main>

  <footer class="app-footer">
    <p>家族用の献立提案アプリ / <a href="https://github.com/CitronStudio/dinner-menu-app" target="_blank" rel="noopener">GitHub</a></p>
  </footer>
</div>

<script src="js/config.js"></script>
<script src="js/app.js"></script>
</body>
</html>
