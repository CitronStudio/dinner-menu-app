name = "dinner-menu-app-worker"
main = "src/index.js"
compatibility_date = "2025-01-01"

# Secrets (set via `wrangler secret put <NAME>`, never commit real values):
#   ANTHROPIC_API_KEY  - Claude API key
#   APP_SHARED_KEY     - shared key the frontend sends in X-App-Key header
#                        (lightweight abuse guard, not real auth - see README)

[vars]
# CORS: origin allowed to call this worker. Update to your GitHub Pages URL.
ALLOWED_ORIGIN = "https://citronstudio.github.io"
